networks:
  web:
    external: true
  internal:
    external: false

services:
  cosycreator_mongo:
    image: mongo:7
    container_name: ${SITE_DOMAIN}_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    labels:
      - traefik.enable=false

  cosycreator_payload:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PAYLOAD_PUBLIC_SERVER_URL: https://cms.${SITE_DOMAIN}
    image: cosycreator-payload:latest
    container_name: ${SITE_DOMAIN}_payload
    restart: always
    volumes:
      - ./media:/app/media
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${SITE_DOMAIN}_mongo:27017/cosycreator
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: https://cms.${SITE_DOMAIN}
      NUXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      - cosycreator_mongo
    networks:
      - internal
      - web
    labels:
      # Public surface of the CMS host: uploaded media (referenced by the
      # site) and the health probe (monitoring blackbox). The Nuxt frontend
      # reads the API over the internal network, never through this host.
      - traefik.http.routers.cosycreator_payload_public.rule=Host(`cms.${SITE_DOMAIN}`) && (PathPrefix(`/media`) || Path(`/api/health`))
      - traefik.http.routers.cosycreator_payload_public.priority=20
      - traefik.http.routers.cosycreator_payload_public.tls=true
      - traefik.http.routers.cosycreator_payload_public.tls.certresolver=lets-encrypt
      - traefik.http.routers.cosycreator_payload_public.service=cosycreator_payload
      # Everything else (admin UI, REST + GraphQL API, login / forgot-password /
      # reset / unlock) is reachable from the admin IP allowlist only. Payload
      # 1.x has unpatched pre-auth issues (account takeover, CSRF bypass, SSRF
      # in uploads) whose only fix is the v3 migration tracked in #46.
      - traefik.http.routers.cosycreator_payload.rule=Host(`cms.${SITE_DOMAIN}`)
      - traefik.http.routers.cosycreator_payload.priority=10
      - traefik.http.routers.cosycreator_payload.middlewares=admin-ipallowlist@file
      - traefik.http.routers.cosycreator_payload.tls=true
      - traefik.http.routers.cosycreator_payload.tls.certresolver=lets-encrypt
      - traefik.http.routers.cosycreator_payload.service=cosycreator_payload
      - traefik.http.services.cosycreator_payload.loadbalancer.server.port=3001

  cosycreator_nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cosycreator-nuxt:latest
    restart: always
    environment:
      NODE_ENV: production
      PAYLOAD_BASE_URL: http://${SITE_DOMAIN}_payload:3001
      NUXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    container_name: ${SITE_DOMAIN}_nuxt
    depends_on:
      - cosycreator_payload
    labels:
      - traefik.http.routers.cosycreator_nuxt.rule=Host(`${SITE_DOMAIN}`) || Host(`www.${SITE_DOMAIN}`)
      - traefik.http.routers.cosycreator_nuxt.tls=true
      - traefik.http.routers.cosycreator_nuxt.tls.certresolver=lets-encrypt
      - traefik.http.services.cosycreator_nuxt.loadbalancer.server.port=3000
    networks:
      - web
      - internal

volumes:
  mongo_data: {}
